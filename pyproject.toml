[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffolio"
version = "0.1.0"
description = "Risk-dependent diffusion model for portfolio generation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "network: touches the real provider; opt in with DIFFOLIO_NETWORK_TESTS=1",
]
filterwarnings = ["ignore::DeprecationWarning"]
