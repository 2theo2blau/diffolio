name: us_sp500

universe:
  market: US
  roster: sp500
  benchmark: ^GSPC
  trading_days_per_year: 252
  # The paper reports N = 224 for the U.S. market.
  target_size: 224
  min_price: 1.0
  min_avg_dollar_volume: 5.0e6
  max_missing_frac: 0.05
  require_full_history: true
  # DHR: Yahoo's adjusted history mishandles the 2016-07 Fortive spin-off
  # (adjusted open 41.6 -> 65.2 overnight, a fake +57% return).
  exclude: [DHR]
  include: []

data:
  start: "2010-01-01"
  end: "2024-12-31"
  cache_dir: data/cache
  calendar_mode: benchmark
  max_daily_jump: 10.0
  max_constant_run: 20
  drop_anomalous_assets: true
  download_batch_size: 50
  download_max_retries: 3

features:
  columns: [open, high, low, close, volume]
  price_normalization: rolling_ref
  ref_window: 20
  volume_transform: log_rel
  standardize: true
  clip_sigma: 10.0

window:
  lookback: 256   # L; d = L * F = 1280

split:
  train_frac: 0.7
  val_frac: 0.1
  min_valid_target_frac: 0.95
  max_window_fill_frac: 0.05

diffusion:
  num_steps: 500
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 0.02
  cosine_offset: 0.008
  sigma_x_source: base   # paper definition; risk_targets is a deviation
  gamma_max: 5

model:
  hidden_dim: 128
  tcn_kernel_size: 3
  tcn_dilations: [1, 2]
  time_embedding_activation: sigmoid
  mlp_layers: 3
  mlp_activation: silu
  scale_by_sigma_x: false

training:
  batch_size: 128
  learning_rate: 1.0e-3
  max_epochs: 400
  patience: 20
  aux_weight: 1.0
  seed: 0
